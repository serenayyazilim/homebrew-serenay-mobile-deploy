name: Update cask

on:
  schedule:
    - cron: "0 */3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check latest release of the app repo
        id: release
        run: |
          latest=$(curl -sL -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/serenayyazilim/serenay-mobile-deploy/releases/latest)
          version=$(echo "$latest" | jq -r '.tag_name | ltrimstr("v")')
          asset_url=$(echo "$latest" | jq -r '.assets[] | select(.name | test("aarch64\\.dmg$")) | .browser_download_url')

          if [ -z "$version" ] || [ "$version" = "null" ] || [ -z "$asset_url" ] || [ "$asset_url" = "null" ]; then
            echo "No usable release/asset found, skipping." >&2
            echo "found=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "found=true" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "asset_url=$asset_url" >> "$GITHUB_OUTPUT"

      - name: Compare against cask's current version
        id: compare
        if: steps.release.outputs.found == 'true'
        run: |
          current=$(grep -m1 '^[[:space:]]*version "' Casks/serenay-mobile-deploy.rb | sed -E 's/.*version "([^"]+)".*/\1/')
          echo "current=$current" >> "$GITHUB_OUTPUT"
          if [ "$current" = "${{ steps.release.outputs.version }}" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Download release asset and compute sha256
        id: sha
        if: steps.compare.outputs.changed == 'true'
        run: |
          curl -sL -o app.dmg "${{ steps.release.outputs.asset_url }}"
          sha256=$(sha256sum app.dmg | cut -d' ' -f1)
          echo "sha256=$sha256" >> "$GITHUB_OUTPUT"

      - name: Update Casks/serenay-mobile-deploy.rb
        if: steps.compare.outputs.changed == 'true'
        run: |
          sed -i -E "s/^([[:space:]]*version \")[^\"]+(\")/\1${{ steps.release.outputs.version }}\2/" Casks/serenay-mobile-deploy.rb
          sed -i -E "s/^([[:space:]]*sha256 \")[^\"]+(\")/\1${{ steps.sha.outputs.sha256 }}\2/" Casks/serenay-mobile-deploy.rb

      - name: Commit and push
        if: steps.compare.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Casks/serenay-mobile-deploy.rb
          git commit -m "Update serenay-mobile-deploy to ${{ steps.release.outputs.version }}"
          git push
